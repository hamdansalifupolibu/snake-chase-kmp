name: KMP Multiplatform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Android + Desktop + Shared Engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Kotlin Coding Conventions (ktlint)
        run: ./gradlew :composeApp:ktlintCheck

      - name: Run Common Multiplatform Unit Tests
        run: ./gradlew :composeApp:allTests

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Build Desktop Distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS

  ios-check:
    name: Verify iOS Native Target Compilation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile iOS Simulator Framework
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64
