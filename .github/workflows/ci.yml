name: KMP Multiplatform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Android + Desktop + Shared Engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kotlin Coding Conventions (ktlint)
        run: ./gradlew :composeApp:ktlintCheck

      - name: Run Common Multiplatform Unit Tests
        run: ./gradlew :composeApp:allTests

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Build Desktop Distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS

  ios-check:
    name: Verify iOS Native Target Compilation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS Simulator Framework
        run: |
          set -o pipefail
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 2>&1 | tee ios-build.log

      # Surfaces compiler errors as annotations, readable on the run page without opening the log.
      - name: Report iOS compile errors
        if: failure()
        run: |
          grep -E '^e: ' ios-build.log | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          grep -A6 'What went wrong' ios-build.log | head -14 | sed 's/^/::warning::/' || true
